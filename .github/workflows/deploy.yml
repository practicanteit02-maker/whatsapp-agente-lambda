name: Deploy Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Empaquetar función
        # Excluye los tests (test/*, ver package.json) y todo lo que solo
        # existe para poder correrlos en local/CI (node_modules,
        # package.json, package-lock.json) — la Lambda en producción sigue
        # recibiendo el SDK de AWS del propio runtime, no de node_modules, así
        # que ninguno de estos archivos hace falta en el zip desplegado.
        run: zip -r function.zip . -x "*.git*" -x ".github/*" -x "test/*" -x "node_modules/*" -x "package.json" -x "package-lock.json"
        
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::688066488480:role/github-actions-whatsapp-agente-lambda-deploy
          aws-region: us-east-2
          role-skip-session-tagging: true
          
      - name: Desplegar a Lambda
        run: |
          aws lambda update-function-code \
            --function-name whatsapp-agente-test \
            --zip-file fileb://function.zip
